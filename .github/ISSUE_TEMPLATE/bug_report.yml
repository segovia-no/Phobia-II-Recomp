name: Bug report
description: Something does not work or looks/sounds wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps, what you expected, what you saw or heard. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The terminal output of build/phobia2 (FATAL lines include guest registers and a backtrace). Never attach game files.
      render: text
